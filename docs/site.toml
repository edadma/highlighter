# highlighter documentation site — built with juicer, juicerdocs theme.
#
# Local preview:  cd /Users/ed/dev/juicer && sbt 'juicerJVM/run serve -s /Users/ed/dev/highlighter/docs -L'
# Build:          cd /Users/ed/dev/juicer && sbt 'juicerJVM/run build -s /Users/ed/dev/highlighter/docs -d /Users/ed/dev/highlighter/docs/_site'

title       = "highlighter"
author      = "Ed Maxedon"
baseURL     = "https://highlighter.edadma.dev/"
description = "A cross-platform Scala syntax highlighter using VS Code-compatible TextMate grammars."

# Drives the topbar GitHub icon and the homepage hero "Star on GitHub" button.
repoURL = "https://github.com/edadma/highlighter"

theme = "juicerdocs"

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift = 0

# Static hosts serve the on-disk layout literally, so the URL space must match
# the file tree. The standard baseline ships htmlDir = "html", which strips a
# segment from URLs but not from paths and breaks deploys. Force it off.
htmlDir = ""

# Recompile the theme CSS from SCSS and bundle/minify the theme JS on every
# build (fingerprinted for cache-busting). When sass/esbuild aren't on PATH the
# pipeline degrades to a verbatim copy of the source, so the page still renders.
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
version    = "v0.0.10"
getStarted = true

# Teal palette. Light mode.
brand           = "#0ca678"        # teal-6 — links, button fills, hero gradient start
brandStrong     = "#099268"        # teal-7 — hover state
brandSoft       = "#c3fae8"        # teal-1 — soft tint: sidebar hover, badges
accent          = "#20c997"        # teal-5 — hero gradient end, decorative highlights

# Dark-mode overrides (lighter, as dark surfaces need more luminance).
brandDark       = "#63e6be"        # teal-3
brandStrongDark = "#96f2d7"        # teal-2
brandSoftDark   = "rgb(12 166 120 / .14)"
accentDark      = "#38d9a9"        # teal-4
